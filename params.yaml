train:
  data:
    n_samples: 500
    n_features: 12
    n_informative: 6
    n_redundant: 2
    n_repeated: 0
    n_classes: 2
    class_sep: 1.0
    random_state: 42
    test_size: 0.2

  model:
    model_type: 'rf'
    max_iter: 200
    random_state: 42
    n_estimators: 50
    max_depth: 6
    n_jobs: 4
    format: 'pickle'

  scoring: 'f1'
  processed_data_dir: 'data/processed'
  processed_files:
    X: 'X.csv'
    y: 'y.csv'
  model_output: 'models/dvc_model.pickle'
  metrics_output: 'metrics/metrics.json'
  logging_level: 'INFO'
