[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "my_project"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Anastasiya Bronina" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "coverage>=7.11.0",
    "loguru",
    "mkdocs",
    "pandas>=2.3.3",
    "pip",
    "pydantic>=2.12.3",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn>=1.7.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["my_project"]
include = ["pyproject.toml", "my_project/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["my_project"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pylint>=4.0.0",
]

